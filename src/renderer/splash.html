<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ryvie • Splash</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: transparent;
      overflow: hidden;
      border-radius: 24px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border-radius: 24px;
    }
    .shell {
      background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.45);
      padding: 30px 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 94%;
      height: 86%;
    }
    .card {
      width: 320px;
      height: 220px;
      background: rgba(255,255,255,0.9);
      border-radius: 28px;
      box-shadow: 0 30px 80px rgba(2,132,199,0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      animation: fadeUp 400ms ease-out both;
      padding: 20px;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(59,130,246,0.35);
      margin-bottom: 14px;
    }
    .title {
      font-weight: 700;
      font-size: 20px;
      letter-spacing: .3px;
      background: linear-gradient(90deg, #38bdf8, #0ea5e9, #2563eb);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 10px;
    }
    .dots {
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: center;
      height: 14px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #0ea5e9;
      opacity: .25;
      animation: pulse 1.2s infinite ease-in-out;
    }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }
    .update-info {
      display: none;
      width: 100%;
      margin-top: 20px;
    }
    .update-message {
      font-size: 13px;
      color: #64748b;
      text-align: center;
      margin-bottom: 12px;
    }
    .progress-container {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #0ea5e9, #2563eb);
      width: 0%;
      transition: width 0.3s ease;
    }
    .progress-percent {
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
      margin-top: 6px;
    }

    .actions {
      display: none;
      width: 100%;
      gap: 10px;
      margin-top: 14px;
    }

    .btn {
      flex: 1;
      height: 36px;
      border-radius: 12px;
      border: 1px solid rgba(15, 23, 42, 0.12);
      background: rgba(255, 255, 255, 0.85);
      color: rgba(15, 23, 42, 0.85);
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.12);
      background: rgba(255, 255, 255, 0.95);
    }

    .btn-primary {
      border: none;
      background: linear-gradient(90deg, #0ea5e9, #2563eb);
      color: white;
    }

    .btn-primary:hover {
      background: linear-gradient(90deg, #0284c7, #1d4ed8);
    }
    @keyframes fadeUp { from { transform: translateY(6px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes pulse {
      0%, 100% { transform: scale(.8); opacity: .25; }
      50% { transform: scale(1.15); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="card">
      <img class="logo" src="../../ryvielogo0.png" alt="Ryvie" />
      <div class="title">Ryvie Connect</div>
      <div class="dots" id="loading-dots" aria-label="Chargement">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <div class="update-info" id="update-info">
        <div class="update-message" id="update-message">Vérification des mises à jour...</div>
        <div class="progress-container">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="progress-percent" id="progress-percent"></div>
      </div>

      <div class="actions" id="update-actions">
        <button class="btn btn-primary" id="install-btn" type="button">Installer</button>
        <button class="btn" id="later-btn" type="button">Plus tard</button>
      </div>
    </div>
  </div>
  <script>
    if (window.electronAPI && window.electronAPI.onUpdateStatus) {
      window.electronAPI.onUpdateStatus((status) => {
        const dots = document.getElementById('loading-dots');
        const updateInfo = document.getElementById('update-info');
        const actions = document.getElementById('update-actions');
        const message = document.getElementById('update-message');
        const progressBar = document.getElementById('progress-bar');
        const progressPercent = document.getElementById('progress-percent');

        if (status.status === 'checking') {
          dots.style.display = 'flex';
          updateInfo.style.display = 'none';
          actions.style.display = 'none';
        } else if (status.status === 'available') {
          dots.style.display = 'none';
          updateInfo.style.display = 'block';
          actions.style.display = 'flex';
          message.textContent = status.message || 'Mise à jour disponible';
          progressBar.style.width = '0%';
          progressPercent.textContent = '';
        } else if (status.status === 'downloading') {
          dots.style.display = 'none';
          updateInfo.style.display = 'block';
          actions.style.display = 'none';
          message.textContent = status.message || 'Téléchargement en cours...';
          if (status.percent !== undefined) {
            progressBar.style.width = status.percent + '%';
            progressPercent.textContent = Math.round(status.percent) + '%';
          }
        } else if (status.status === 'installing') {
          dots.style.display = 'none';
          updateInfo.style.display = 'block';
          actions.style.display = 'none';
          message.textContent = status.message || 'Installation en cours...';
          progressBar.style.width = '100%';
          progressPercent.textContent = '';
        } else if (status.status === 'error') {
          dots.style.display = 'flex';
          updateInfo.style.display = 'none';
          actions.style.display = 'none';
        }
      });
    }

    const installBtn = document.getElementById('install-btn');
    const laterBtn = document.getElementById('later-btn');

    if (installBtn) {
      installBtn.addEventListener('click', async () => {
        installBtn.disabled = true;
        laterBtn.disabled = true;
        if (window.electronAPI && window.electronAPI.startUpdate) {
          await window.electronAPI.startUpdate();
        }
      });
    }

    if (laterBtn) {
      laterBtn.addEventListener('click', async () => {
        if (window.electronAPI && window.electronAPI.skipUpdate) {
          await window.electronAPI.skipUpdate();
        }
      });
    }
  </script>
</body>
</html>
