<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion - Ryvie Desktop</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="../../ryvielogo0.png" alt="Ryvie Logo" class="logo" />
      <h1>Créer un profil</h1>
    </div>

    <div id="loading-section" class="status-section section visible" style="text-align: center; padding: 30px 0;">
      <div class="spinner"></div>
      <p style="color: #64748b; font-size: 13px; margin-top: 8px;">Vérification en cours...</p>
    </div>

    <div id="users-selection-section" class="status-section section" style="display: none;">
      <div style="margin: 12px auto; max-width: 60%;">
        <p id="users-error" style="color: #ef4444; font-size: 12px; margin: 0 0 16px; text-align: center; display: none;"></p>
        
        <div id="users-list" style="display: grid; gap: 10px; margin-bottom: 16px;"></div>
        
        <button id="add-user-btn" class="btn btn-secondary" style="width: 100%; font-size: 12px;">
          <span>Ajouter un compte</span>
        </button>
      </div>
    </div>

    <div id="first-time-section" class="status-section section" style="display: none;">
      <div style="margin: 0 auto; width: 75%; max-width: 600px; padding-bottom: 20px;">
        <p style="font-size: 14px; color: #64748b; margin: 0 0 16px; text-align: center;">Créez le premier compte administrateur</p>
        
        <div id="first-time-form" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; align-items: start;">
          <div style="grid-column: 1 / -1; min-width: 0;">
            <label for="first-time-uid-input" style="display: block; text-align: left; margin-bottom: 3px; color: #475569; font-size: 13px; font-weight: 600;">Identifiant</label>
            <input type="text" id="first-time-uid-input" placeholder="admin" autocomplete="off" style="width: 100%; padding: 7px 10px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif; transition: border-color 0.2s; box-sizing: border-box;" />
          </div>
          
          <div style="min-width: 0;">
            <label for="first-time-email-input" style="display: block; text-align: left; margin-bottom: 3px; color: #475569; font-size: 13px; font-weight: 600;">Email</label>
            <input type="email" id="first-time-email-input" placeholder="admin@example.org" autocomplete="off" style="width: 100%; padding: 7px 10px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif; transition: border-color 0.2s; box-sizing: border-box;" />
          </div>
          
          <div style="min-width: 0;">
            <label for="first-time-language-select" style="display: block; text-align: left; margin-bottom: 3px; color: #475569; font-size: 13px; font-weight: 600;">Langue</label>
            <select id="first-time-language-select" style="width: 100%; padding: 7px 10px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif; transition: border-color 0.2s; box-sizing: border-box; background: white; cursor: pointer;">
              <option value="fr">Français</option>
              <option value="en">English</option>
            </select>
          </div>
          
          <div style="min-width: 0;">
            <label for="first-time-password-input" style="display: block; text-align: left; margin-bottom: 3px; color: #475569; font-size: 13px; font-weight: 600;">Mot de passe</label>
            <input type="password" id="first-time-password-input" placeholder="Min. 6 caractères" autocomplete="off" style="width: 100%; padding: 7px 10px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif; transition: border-color 0.2s; box-sizing: border-box;" />
          </div>
          
          <div style="min-width: 0;">
            <label for="first-time-confirm-password-input" style="display: block; text-align: left; margin-bottom: 3px; color: #475569; font-size: 13px; font-weight: 600;">Confirmer</label>
            <input type="password" id="first-time-confirm-password-input" placeholder="Retapez le mot de passe" autocomplete="off" style="width: 100%; padding: 7px 10px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif; transition: border-color 0.2s; box-sizing: border-box;" />
          </div>
          
          <p id="first-time-error" style="grid-column: 1 / -1; color: #ef4444; font-size: 12px; margin: 0; display: none;"></p>
        </div>
        
        <div style="margin-top: 16px;">
          <button id="first-time-create-btn" class="btn btn-primary" style="width: 100%; font-size: 15px; padding: 12px;">
            <span>Créer le compte</span>
          </button>
        </div>
      </div>
    </div>

    <div id="login-section" class="status-section section" style="display: none;">
      <button id="back-to-users-btn" class="icon-btn" type="button" title="Retour à la sélection de profil" style="position: absolute; top: 20px; right: 20px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M13 7V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2h6a2 2 0 002-2v-1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div style="margin: 0 auto; max-width: 400px;">
        <!-- Champ Nom du profil -->
        <div style="margin-bottom: 16px;">
          <label for="profile-name-input" style="display: block; text-align: left; margin-bottom: 6px; color: #475569; font-size: 12px; font-weight: 600;">Nom du profil</label>
          <input type="text" id="profile-name-input" placeholder="Nom du profil" value="Mon Ryvie" autocomplete="off" style="width: 100%; padding: 10px 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif; transition: border-color 0.2s; box-sizing: border-box; background: white;" />
        </div>
        
        <!-- Séparateur -->
        <div style="display: flex; align-items: center; margin: 16px 0;">
          <div style="flex: 1; height: 1px; background: #e2e8f0;"></div>
          <span style="padding: 0 12px; color: #475569; font-size: 12px; font-weight: 600;">Méthode de connexion</span>
          <div style="flex: 1; height: 1px; background: #e2e8f0;"></div>
        </div>
        
        <!-- Onglets de sélection de méthode -->
        <div style="display: flex; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 16px; overflow: hidden;">
          <button id="method-local-tab" class="method-tab active" style="flex: 1; padding: 10px 12px; border: none; background: linear-gradient(135deg, #1baced, #1690ea); color: white; font-size: 13px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.2s; border-right: 1px solid #e2e8f0;">
            Locale
          </button>
          <button id="method-manual-tab" class="method-tab" style="flex: 1; padding: 10px 12px; border: none; background: white; color: #475569; font-size: 13px; font-weight: 500; font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.2s;">
            À distance
          </button>
        </div>
        
        <!-- Champs de connexion -->
        <div id="local-fields" style="display: block;">
          <div style="margin-bottom: 12px;">
            <label for="uid-input" style="display: block; text-align: left; margin-bottom: 6px; color: #475569; font-size: 12px; font-weight: 600;">Nom d'utilisateur</label>
            <input type="text" id="uid-input" placeholder="Identifiant" autocomplete="off" style="width: 100%; padding: 10px 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif; transition: border-color 0.2s; box-sizing: border-box; background: white;" />
          </div>
          <div style="margin-bottom: 12px;">
            <label for="password-input" style="display: block; text-align: left; margin-bottom: 6px; color: #475569; font-size: 12px; font-weight: 600;">Mot de passe</label>
            <input type="password" id="password-input" placeholder="Mot de passe" autocomplete="off" style="width: 100%; padding: 10px 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif; transition: border-color 0.2s; box-sizing: border-box; background: white;" />
          </div>
        </div>
        
        <div id="manual-fields" style="display: none;">
          <div style="margin-bottom: 12px;">
            <label for="manual-setup-key-input" style="display: block; text-align: left; margin-bottom: 6px; color: #475569; font-size: 12px; font-weight: 600;">Clé de configuration</label>
            <input type="text" id="manual-setup-key-input" placeholder="Collez votre clé de configuration ici" autocomplete="off" style="width: 100%; padding: 10px 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif; transition: border-color 0.2s; box-sizing: border-box; background: white;" />
          </div>
        </div>
        
        <p id="login-error" style="color: #ef4444; font-size: 12px; margin: 0 0 16px; text-align: center; display: none;"></p>
        
        <!-- Bouton -->
        <button id="login-btn" class="btn btn-primary" style="width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #1baced, #1690ea); color: white; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 14px rgba(27, 172, 237, 0.3);">
          <span>Se connecter</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Modal de confirmation suppression -->
  <div id="confirm-delete-modal" class="modal hidden" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 99999; display: none; align-items: center; justify-content: center; backdrop-filter: blur(2px);">
    <div style="background: white; border-radius: 16px; padding: 24px; max-width: 360px; width: 90%; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);">
      <div style="width: 48px; height: 48px; margin: 0 auto 16px; background: #ef4444; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14zM10 11v6M14 11v6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2 style="font-size: 18px; margin: 0 0 8px; text-align: center; color: #0f172a;">Supprimer l'utilisateur</h2>
      <p id="confirm-delete-message" style="margin: 0 0 20px; color: #64748b; font-size: 14px; text-align: center;">Voulez-vous vraiment supprimer cet utilisateur ?</p>
      <div style="display: flex; gap: 10px;">
        <button id="confirm-delete-btn" class="btn btn-primary" style="flex: 1; font-size: 13px; background: #ef4444;"><span>Supprimer</span></button>
        <button id="cancel-delete-btn" class="btn btn-secondary" style="flex: 1; font-size: 13px;"><span>Annuler</span></button>
      </div>
    </div>
  </div>

  <!-- Modal de renommage de profil -->
  <div id="rename-modal" class="modal hidden" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: 99999; display: none; align-items: center; justify-content: center; backdrop-filter: blur(2px);">
    <div style="background: white; border-radius: 16px; padding: 24px; max-width: 400px; width: 90%; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);">
      <div style="width: 48px; height: 48px; margin: 0 auto 16px; background: #3b82f6; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2 style="font-size: 18px; margin: 0 0 8px; text-align: center; color: #0f172a;">Renommer le profil</h2>
      <p style="margin: 0 0 20px; color: #64748b; font-size: 14px; text-align: center;">Entrez le nouveau nom pour ce profil</p>
      <div style="margin-bottom: 20px;">
        <label for="rename-input" style="display: block; text-align: left; margin-bottom: 6px; color: #475569; font-size: 12px; font-weight: 600;">Nom du profil</label>
        <input type="text" id="rename-input" placeholder="Nouveau nom" autocomplete="off" style="width: 100%; padding: 10px 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif; transition: border-color 0.2s; box-sizing: border-box;" />
        <p id="rename-error" style="color: #ef4444; font-size: 12px; margin-top: 6px; display: none;"></p>
      </div>
      <div style="display: flex; gap: 10px;">
        <button id="confirm-rename-btn" class="btn btn-primary" style="flex: 1; font-size: 13px;"><span>Renommer</span></button>
        <button id="cancel-rename-btn" class="btn btn-secondary" style="flex: 1; font-size: 13px;"><span>Annuler</span></button>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
