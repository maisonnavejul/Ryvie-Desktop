<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion - Ryvie Desktop</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="../../ryvielogo0.png" alt="Ryvie Logo" class="logo" />
      <h1>Connexion à Ryvie</h1>
    </div>

    <div id="loading-section" class="status-section section visible" style="text-align: center; padding: 30px 0;">
      <div class="spinner"></div>
      <p style="color: #64748b; font-size: 13px; margin-top: 8px;">Vérification en cours...</p>
    </div>

    <div id="first-time-section" class="status-section section" style="display: none;">
      <div style="margin: 0 auto; width: 75%; max-width: 600px; padding-bottom: 20px;">
        <p style="font-size: 14px; color: #64748b; margin: 0 0 16px; text-align: center;">Créez le premier compte administrateur</p>
        
        <div id="first-time-form" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; align-items: start;">
          <div style="grid-column: 1 / -1; min-width: 0;">
            <label for="first-time-uid-input" style="display: block; text-align: left; margin-bottom: 3px; color: #475569; font-size: 13px; font-weight: 600;">Identifiant</label>
            <input type="text" id="first-time-uid-input" placeholder="admin" autocomplete="off" style="width: 100%; padding: 7px 10px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif; transition: border-color 0.2s; box-sizing: border-box;" />
          </div>
          
          <div style="min-width: 0;">
            <label for="first-time-email-input" style="display: block; text-align: left; margin-bottom: 3px; color: #475569; font-size: 13px; font-weight: 600;">Email</label>
            <input type="email" id="first-time-email-input" placeholder="admin@example.org" autocomplete="off" style="width: 100%; padding: 7px 10px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif; transition: border-color 0.2s; box-sizing: border-box;" />
          </div>
          
          <div style="min-width: 0;">
            <label for="first-time-language-select" style="display: block; text-align: left; margin-bottom: 3px; color: #475569; font-size: 13px; font-weight: 600;">Langue</label>
            <select id="first-time-language-select" style="width: 100%; padding: 7px 10px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif; transition: border-color 0.2s; box-sizing: border-box; background: white; cursor: pointer;">
              <option value="fr">Français</option>
              <option value="en">English</option>
            </select>
          </div>
          
          <div style="min-width: 0;">
            <label for="first-time-password-input" style="display: block; text-align: left; margin-bottom: 3px; color: #475569; font-size: 13px; font-weight: 600;">Mot de passe</label>
            <input type="password" id="first-time-password-input" placeholder="Min. 6 caractères" autocomplete="off" style="width: 100%; padding: 7px 10px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif; transition: border-color 0.2s; box-sizing: border-box;" />
          </div>
          
          <div style="min-width: 0;">
            <label for="first-time-confirm-password-input" style="display: block; text-align: left; margin-bottom: 3px; color: #475569; font-size: 13px; font-weight: 600;">Confirmer</label>
            <input type="password" id="first-time-confirm-password-input" placeholder="Retapez le mot de passe" autocomplete="off" style="width: 100%; padding: 7px 10px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif; transition: border-color 0.2s; box-sizing: border-box;" />
          </div>
          
          <p id="first-time-error" style="grid-column: 1 / -1; color: #ef4444; font-size: 12px; margin: 0; display: none;"></p>
        </div>
        
        <div style="margin-top: 16px;">
          <button id="first-time-create-btn" class="btn btn-primary" style="width: 100%; font-size: 15px; padding: 12px;">
            <span>Créer le compte</span>
          </button>
        </div>
      </div>
    </div>

    <div id="login-section" class="status-section section" style="display: none;">
      <div style="margin: 12px auto; max-width: 50%;">
        <div style="margin-bottom: 10px;">
          <label for="uid-input" style="display: block; text-align: left; margin-bottom: 3px; color: #475569; font-size: 11px; font-weight: 600;">Utilisateur</label>
          <input type="text" id="uid-input" placeholder="Identifiant" autocomplete="off" style="width: 100%; padding: 8px; border: 2px solid #e2e8f0; border-radius: 6px; font-size: 12px; font-family: 'Inter', sans-serif; transition: border-color 0.2s;" />
        </div>
        <div style="margin-bottom: 10px;">
          <label for="password-input" style="display: block; text-align: left; margin-bottom: 3px; color: #475569; font-size: 11px; font-weight: 600;">Mot de passe</label>
          <input type="password" id="password-input" placeholder="Mot de passe" autocomplete="off" style="width: 100%; padding: 8px; border: 2px solid #e2e8f0; border-radius: 6px; font-size: 12px; font-family: 'Inter', sans-serif; transition: border-color 0.2s;" />
        </div>
        <p id="login-error" style="color: #ef4444; font-size: 11px; margin-top: 6px; display: none;"></p>
      </div>
      
      <div style="display: flex; gap: 8px; margin-top: 12px;">
        <button id="login-btn" class="btn btn-primary" style="flex: 1; font-size: 12px;">
          <span>Se connecter</span>
        </button>
        
        <button id="manual-setup-btn-login" class="btn btn-secondary" style="flex: 1; font-size: 12px;">
          <span>Configuration manuelle</span>
        </button>
      </div>
    </div>

    <div id="manual-setup-modal" class="modal hidden" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; background: white; z-index: 99999; overflow: hidden; margin: 0; padding: 0; border-radius: 24px;">
      <div style="width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;">
        <div style="width: 100%; max-width: 500px;">
          <div style="width: 50px; height: 50px; margin: 0 auto 16px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <h2 style="font-size: 22px; margin: 0 0 12px; text-align: center; color: #0f172a;">Configuration Manuelle</h2>
          <p style="margin-bottom: 20px; color: #64748b; font-size: 13px; text-align: center;">Entrez votre clé de configuration pour vous connecter manuellement.</p>
          <div style="margin: 16px 0;">
            <div style="margin-bottom: 12px;">
              <label for="manual-setup-key-input" style="display: block; text-align: left; margin-bottom: 4px; color: #475569; font-size: 12px; font-weight: 600;">Clé de Configuration</label>
              <input type="text" id="manual-setup-key-input" placeholder="Collez votre clé de configuration ici" style="width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 6px; font-size: 13px; font-family: 'Inter', sans-serif; transition: border-color 0.2s; box-sizing: border-box;" />
            </div>
            <p id="manual-setup-error" style="color: #ef4444; font-size: 12px; margin-top: 6px; display: none;"></p>
          </div>
          <div style="display: flex; gap: 10px; margin-top: 16px;">
            <button id="manual-setup-confirm-btn" class="btn btn-primary" style="flex: 1; font-size: 13px;"><span>Confirmer</span></button>
            <button id="manual-setup-cancel-btn" class="btn btn-secondary" style="flex: 1; font-size: 13px;"><span>Annuler</span></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
